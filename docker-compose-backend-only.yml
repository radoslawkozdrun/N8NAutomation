version: '3.8'

services:
  # Backend only (without frontend)
  app:
    build: 
      context: .
      dockerfile: Dockerfile.backend-only
    container_name: n8n-automation-app
    restart: unless-stopped
    environment:
      # External Database
      DB_HOST: ${DB_HOST:-srv936559.hstgr.cloud}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-true}
      
      # Application
      NODE_ENV: production
      PORT: 8002
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s