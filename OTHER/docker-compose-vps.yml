version: '3.8'

# VPS Production Configuration - External Database
# This configuration connects to external PostgreSQL database
# No local database container is created

services:
  # Application (connects to external database)
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: n8n-automation-app
    restart: unless-stopped
    env_file:
      - .env.vps
    ports:
      - "8002:8002"
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Nginx Reverse Proxy (optional, for custom domain/SSL)
  nginx:
    image: nginx:alpine
    container_name: n8n-automation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - n8n-network
    depends_on:
      - app
    profiles:
      - with-nginx

networks:
  n8n-network:
    driver: bridge

# Note: No volumes for database since we use external PostgreSQL